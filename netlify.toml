exports.handler = async function (event) {
  if (event.httpMethod !== "POST") {
    return { statusCode: 405, body: "Method not allowed" };
  }

  try {
    const body = JSON.parse(event.body || "{}");
    const stations = Array.isArray(body.stations)
      ? body.stations.slice(0, 100)
      : [];

    const observations = {};
    const end = new Date();
    const start = new Date(end);
    start.setUTCDate(start.getUTCDate() - 7);

    const dateString = d => d.toISOString().slice(0, 10);

    await Promise.all(stations.map(async station => {
      if (typeof station !== "string" || !/^[A-Za-z0-9_-]{2,15}$/.test(station)) return;

      try {
        const response = await fetch("https://data.rcc-acis.org/StnData", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sid: station,
            sdate: dateString(start),
            edate: dateString(end),
            elems: [{ name: "snowdepth" }]
          })
        });

        if (!response.ok) return;
        const result = await response.json();
        const rows = Array.isArray(result.data) ? result.data : [];

        for (let i = rows.length - 1; i >= 0; i--) {
          const [date, values] = rows[i];
          const raw = Array.isArray(values) ? values[0] : values;
          const depth = Number(raw);
          if (raw !== "M" && raw !== "T" && raw !== null &&
              raw !== "" && Number.isFinite(depth) && depth >= 0) {
            observations[station] = { depth, date };
            break;
          }
        }
      } catch (err) {
        console.error("Station error:", station, err.message);
      }
    }));

    return {
      statusCode: 200,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ observations })
    };
  } catch (err) {
    return {
      statusCode: 500,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ error: err.message })
    };
  }
};